version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: loyalty-bot-db
    environment:
      POSTGRES_DB: loyalty_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loyalty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Используем образ из Docker Hub (замените YOUR_USERNAME)
    image: ${DOCKER_USERNAME}/loyalty-bot:latest
    container_name: loyalty-bot-app
    environment:
      # Spring профиль
      SPRING_PROFILES_ACTIVE: prod
      
      # База данных PostgreSQL
      DATABASE_URL: jdbc:postgresql://postgres:5432/loyalty_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      
      # Telegram Bot
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      
      # Admin
      ADMIN_SECRET_CODE: ${ADMIN_SECRET_CODE:?ADMIN_SECRET_CODE is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Also used by TokenEncryptionService for mailbox secrets (MailboxConnection.encryptedSecret) -
      # not only the generic "encryption" name. Losing/rotating this key without a migration plan
      # makes every already-stored mailbox app-password undecryptable - see backup guidance in
      # docs/ARCHITECTURE.md §22.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}

      # Supplier import automation (Prompts 01-09, docs/ARCHITECTURE.md). All optional: the app
      # starts fine and the mailbox/AI stages simply no-op if these are unset (docs/ARCHITECTURE.md
      # §22 "Disabled-by-default AI/mailbox providers"). SUPPLIER_IMPORT_STORAGE_PATH must point at
      # the bind-mounted volume below, not an ephemeral container path, or every ingested file is
      # lost on container recreate.
      SUPPLIER_IMPORT_STORAGE_PATH: ${SUPPLIER_IMPORT_STORAGE_PATH:-/data/import-files}
      SUPPLIER_IMPORT_DEEPSEEK_API_KEY: ${SUPPLIER_IMPORT_DEEPSEEK_API_KEY:-}
      SUPPLIER_IMPORT_DEEPSEEK_MODEL: ${SUPPLIER_IMPORT_DEEPSEEK_MODEL:-deepseek-chat}
      SUPPLIER_IMPORT_DEEPSEEK_BASE_URL: ${SUPPLIER_IMPORT_DEEPSEEK_BASE_URL:-https://api.deepseek.com}

      # Bounds the shared @Scheduled thread pool (mailbox poll/parse/normalize/match/validate/apply
      # jobs + existing loyalty cron jobs) - see docs/ARCHITECTURE.md §22.
      SCHEDULING_POOL_SIZE: ${SCHEDULING_POOL_SIZE:-10}
      
      # Опционально: порт
      PORT: ${PORT:-8080}
    volumes:
      # Immutable supplier price-file storage (LocalImportFileStorage) - must survive container
      # recreate/redeploy and be included in backups (docs/ARCHITECTURE.md §22).
      - import_files:/data/import-files
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - loyalty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  import_files:
    driver: local

networks:
  loyalty-network:
    driver: bridge


