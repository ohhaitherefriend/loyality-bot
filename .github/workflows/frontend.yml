name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'admin-panel/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'admin-panel/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit dependencies (non-blocking)
        # Surface known-vulnerable dependencies without failing the build on advisories
        # that don't yet have a fix available; see docs/DECISIONS.md for the audit policy.
        run: npm audit --audit-level=high || true
