name: Frontend CI

on:
  push:
    branches: [master]
    paths:
      - 'admin-panel/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'admin-panel/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit dependencies (blocking on critical)
        # Actually fails the build on critical-severity advisories (currently 0 - passes today).
        # This is the one severity level with no accepted/deferred exceptions, so it can enforce
        # for real instead of being a no-op; see docs/DECISIONS.md ADR-022 for why high/moderate
        # are reported but not blocking (4 known findings need breaking upstream upgrades and are
        # tracked separately, not silently ignored).
        run: npm audit --audit-level=critical

      - name: Audit dependencies (high/moderate, non-blocking report)
        # Surfaces the deferred findings in every CI run's logs without re-blocking on them here.
        run: npm audit --audit-level=high || true
