name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - '.github/workflows/backend.yml'

# Cancel superseded runs on the same branch/PR so CI capacity isn't wasted on stale pushes.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        # Testcontainers (FlywayPostgresSchemaTest and friends) needs a working Docker daemon,
        # which GitHub-hosted ubuntu-latest runners provide out of the box.
        run: ./mvnw -B verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: target/surefire-reports/
          retention-days: 14
