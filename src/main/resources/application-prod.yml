spring:
  application:
    name: zabotik
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loyalty_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  flyway:
    enabled: false  # Отключаем - миграции для MySQL, используем Hibernate ddl-auto

spring.h2.console.enabled: false

security:
  encryption:
    enabled: true
    key: ${ENCRYPTION_KEY}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    admin-secret: ${ADMIN_SECRET_CODE}

loyalty:
  purchase-code:
    expiration-minutes: 10
    length: 6
  discount-code:
    length: 8
  points:
    bronze-threshold: 0
    silver-threshold: 500
    gold-threshold: 1000

server:
  port: ${PORT:8080}
  base-url: ${SERVER_BASE_URL:}

# Actuator endpoints для health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

billing:
  trial-days: ${BILLING_TRIAL_DAYS:7}
  enforcement-mode: ${BILLING_ENFORCEMENT_MODE:STRICT}

cloudpayments:
  public-id: ${CLOUDPAYMENTS_PUBLIC_ID:pk_8671a509172fdf03f6e68c7b8a1ab}
  api-secret: ${CLOUDPAYMENTS_API_SECRET:75698e3a81d1b365264dac03a637d392}

logging:
  level:
    com.plstk: INFO
    org.telegram: WARN
    org.hibernate: WARN