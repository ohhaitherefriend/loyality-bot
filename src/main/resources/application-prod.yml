spring:
  application:
    name: zabotik
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loyalty_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      # Stage 6/ADR-013: Flyway (not Hibernate) now owns the production schema. `validate` fails
      # startup loudly if an entity mapping and the migrated schema ever disagree, instead of
      # `update` silently patching production tables on every deploy.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  flyway:
    enabled: true
    # `prod` was schema-managed exclusively by Hibernate `ddl-auto: update` through V23 (see each
    # migration file's comment for exactly which ones this covers). baseline-on-migrate marks that
    # pre-existing schema as "already at V23" on first run instead of trying to CREATE TABLE
    # everything from scratch, then Flyway executes V24+ for real - those are the genuinely new
    # migrations from this release. This value is a one-time historical fact about this specific
    # cutover, not a knob to casually change; see docs/DECISIONS.md ADR-013.
    baseline-on-migrate: true
    baseline-version: ${FLYWAY_BASELINE_VERSION:23}
    baseline-description: "Pre-Flyway schema (Hibernate ddl-auto managed)"

  # See application.yml for rationale: bounds the shared @Scheduled thread pool so supplier-import
  # jobs (mailbox poll, parse, normalize, match, validate, apply) and loyalty cron jobs don't
  # serialize onto a single thread in production.
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:10}

spring.h2.console.enabled: false

security:
  encryption:
    enabled: true
    key: ${ENCRYPTION_KEY}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    admin-secret: ${ADMIN_SECRET_CODE}

loyalty:
  purchase-code:
    expiration-minutes: 10
    length: 6
  discount-code:
    length: 8
  points:
    bronze-threshold: 0
    silver-threshold: 500
    gold-threshold: 1000

server:
  port: ${PORT:8080}
  base-url: ${SERVER_BASE_URL:}

# Actuator endpoints для health checks
management:
  endpoints:
    web:
      exposure:
        # prometheus: supplier-import pipeline health counters (SupplierImportMetrics). Already
        # behind SecurityConfig's `.requestMatchers("/actuator/**").authenticated()` - only
        # /actuator/health and /actuator/info are permitAll.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Stage 10: /actuator/health/liveness + /actuator/health/readiness for the container
      # orchestrator's probes (see docs/ARCHITECTURE.md §22).
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

billing:
  trial-days: ${BILLING_TRIAL_DAYS:7}
  enforcement-mode: ${BILLING_ENFORCEMENT_MODE:STRICT}

# No hardcoded fallback secret here on purpose (see application.yml comment). Production must
# set CLOUDPAYMENTS_API_SECRET explicitly or HMAC validation is skipped, not silently bypassed
# with a real-looking value checked into git.
cloudpayments:
  public-id: ${CLOUDPAYMENTS_PUBLIC_ID:}
  api-secret: ${CLOUDPAYMENTS_API_SECRET:}

commerce:
  mini-app:
    enabled: ${COMMERCE_MINI_APP_ENABLED:true}
    public-url: ${COMMERCE_MINI_APP_PUBLIC_URL:}
    require-telegram-auth: ${COMMERCE_MINI_APP_REQUIRE_TELEGRAM_AUTH:true}
    init-data-max-age-seconds: ${COMMERCE_MINI_APP_INIT_DATA_MAX_AGE_SECONDS:86400}

logging:
  level:
    com.plstk: INFO
    org.telegram: WARN
    org.hibernate: WARN
  # Stage 10: same [correlationId] tag as application.yml, no ANSI color codes (prod logs go to a
  # file/log aggregator, not an interactive terminal).
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [%15.15t] [%X{correlationId:-OFF}] %-40.40logger{39} : %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"