spring:
  application:
    name: loyalty-bot
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loyalty_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: false  # Временно отключаем валидацию для V1

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    admin-secret: ${ADMIN_SECRET_CODE:}

loyalty:
  purchase-code:
    expiration-minutes: 10
    length: 6
  discount-code:
    length: 8
  points:
    bronze-threshold: 0
    silver-threshold: 500
    gold-threshold: 1000

server:
  port: ${PORT:8080}

# Actuator endpoints для health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.plstk: INFO
    org.telegram: WARN
    org.hibernate: WARN