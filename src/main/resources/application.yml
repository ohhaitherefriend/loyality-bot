spring:
  application:
    name: zabotik
  
  datasource:
    url: jdbc:h2:mem:loyaltydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: false  # Отключаем Flyway для dev, используем Hibernate ddl-auto
    # baseline-on-migrate: true
    # locations: classpath:db/migration
    # baseline-version: 0
    # validate-on-migrate: false
  
  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring Boot's own defaults (max-file-size=1MB, max-request-size=10MB) are well below
  # supplier-import.storage.max-file-size-bytes (30MB default) - without this, the manual-upload
  # endpoint (SupplierImportAdminController) would reject every real supplier price file with a
  # generic multipart error before AttachmentIngestionService's own size check ever runs. Kept a
  # little above the app-level limit so that check (not this framework-level one) produces the
  # actionable error message.
  servlet:
    multipart:
      max-file-size: ${SUPPLIER_IMPORT_MULTIPART_MAX_FILE_SIZE:40MB}
      max-request-size: ${SUPPLIER_IMPORT_MULTIPART_MAX_REQUEST_SIZE:45MB}

  # Bounded thread pool for ALL @Scheduled jobs in the app (loyalty cron jobs + supplier-import
  # mailbox/parsing/normalizing/matching/validation/apply jobs). Without this, Spring Boot's
  # default TaskScheduler has a pool size of 1, so every @Scheduled method in the whole
  # application - across unrelated domains - serializes onto a single shared thread; a slow IMAP
  # poll or a large batch apply would silently delay every other scheduled job. Each job type
  # still has its own DB-backed claim/lease (see ImportJobClaimService), so running multiple job
  # types concurrently is safe.
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:10}

# ========== BYOB Multi-tenant Configuration ==========

# Server configuration
server:
  port: 8080
  # ВАЖНО: установите base-url для webhook регистрации!
  base-url: ${SERVER_BASE_URL:}

# Security & Encryption
security:
  encryption:
    # Включить/выключить шифрование токенов ботов
    enabled: ${ENCRYPTION_ENABLED:true}
    # AES-256 ключ (Base64). Сгенерируйте: TokenEncryptionService.generateKey()
    # ВАЖНО: храните в секрете! Используйте переменные окружения в production
    key: ${ENCRYPTION_KEY:}
  jwt:
    # JWT secret key (минимум 32 символа для HS256)
    secret: ${JWT_SECRET:}
    # Срок жизни токена в часах
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

# App-wide (non-shop-scoped) admin settings
app:
  # Stage 8 security hardening: comma-separated AdminUser emails allowed to call platform-wide
  # endpoints (POST /api/admin/webhooks/update-all, GET /api/stats). Empty by default = nobody
  # can call them (fail closed) — these endpoints have no shopId to scope by AuthorizationService.
  system-admin-emails: ${SYSTEM_ADMIN_EMAILS:}

# Billing configuration
billing:
  trial-days: ${BILLING_TRIAL_DAYS:7}
  enforcement-mode: ${BILLING_ENFORCEMENT_MODE:STRICT}

# CloudPayments
# No hardcoded fallback secret here on purpose: CloudPaymentsService already defaults
# api-secret to "" when the env var is unset, which safely skips HMAC validation (dev-only
# behavior) instead of silently trusting a real-looking value checked into git.
cloudpayments:
  public-id: ${CLOUDPAYMENTS_PUBLIC_ID:}
  api-secret: ${CLOUDPAYMENTS_API_SECRET:}

# Telegram Bot Configuration (legacy single-bot mode)
telegram:
  bot:
    # Используется только для single-tenant режима
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    admin-secret: ${ADMIN_SECRET:}

# Loyalty Program Settings
loyalty:
  purchase-code:
    expiration-minutes: 10
    length: 6
  spend-code:
    expiration-minutes: 10
    length: 6
  discount-code:
    length: 8
  points:
    bronze-threshold: 0
    silver-threshold: 500
    gold-threshold: 1000

# Actuator endpoints для health checks. prometheus exposes supplier-import pipeline health
# counters (SupplierImportMetrics). Already behind SecurityConfig's
# `.requestMatchers("/actuator/**").authenticated()` - only health/info are permitAll.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Stage 10: exposes /actuator/health/liveness and /actuator/health/readiness for container
      # orchestrators (k8s livenessProbe/readinessProbe, docker-compose healthcheck). Readiness
      # flips to false while the app is still starting/shutting down; liveness only reflects
      # unrecoverable internal failure (see Spring Boot's AvailabilityChangeEvent), never a
      # degraded-but-recoverable state like DeepSeek being down (see SupplierImportHealthIndicator).
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Support Bot (feedback)
support:
  bot:
    token: ${SUPPORT_BOT_TOKEN:}
    admin-chat-id: ${SUPPORT_ADMIN_CHAT_ID:0}

logging:
  level:
    com.plstk: INFO
    org.telegram: INFO
  # Stage 10: [correlationId] tag on every log line, populated by CorrelationIdFilter from the
  # inbound X-Correlation-Id header (or a fresh UUID if absent), so a single request's log lines -
  # including ones straddling async @Scheduled pipeline stages that log the same batch/job id -
  # can be grepped together in aggregated logs (CloudWatch/Loki/etc) without a tracing backend.
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{correlationId:-OFF}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

# Commerce MVP
commerce:
  import:
    default-markup-percent: 35
  image-search:
    enabled: ${COMMERCE_IMAGE_SEARCH_ENABLED:false}
    provider: ${COMMERCE_IMAGE_SEARCH_PROVIDER:disabled}
    max-results-per-query: ${COMMERCE_IMAGE_SEARCH_MAX_RESULTS:10}
    min-confidence-to-download: ${COMMERCE_IMAGE_SEARCH_MIN_CONFIDENCE:50}
    max-products-per-batch: ${COMMERCE_IMAGE_SEARCH_MAX_PRODUCTS_PER_BATCH:50}
    request-timeout-ms: ${COMMERCE_IMAGE_SEARCH_TIMEOUT_MS:10000}
    rate-limit-ms: ${COMMERCE_IMAGE_SEARCH_RATE_LIMIT_MS:500}
    brave:
      api-key: ${BRAVE_SEARCH_API_KEY:}
  image-ranker:
    provider: ${COMMERCE_IMAGE_RANKER:rule-based}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      timeout-ms: ${DEEPSEEK_TIMEOUT_MS:15000}
  image-normalization:
    output-size: ${COMMERCE_IMAGE_OUTPUT_SIZE:1024}
    background: "#FFFFFF"
    background-removal:
      provider: ${COMMERCE_BACKGROUND_REMOVAL_PROVIDER:disabled}
      timeout-ms: ${COMMERCE_BACKGROUND_REMOVAL_TIMEOUT_MS:30000}
      rembg:
        url: ${REMBG_URL:http://localhost:7000/remove}
        health-url: ${REMBG_HEALTH_URL:http://localhost:7000/health}
  image-storage:
    base-path: ./data/product-images
    public-url-prefix: /files/product-images
  mini-app:
    enabled: ${COMMERCE_MINI_APP_ENABLED:true}
    public-url: ${COMMERCE_MINI_APP_PUBLIC_URL:http://localhost:3000}
    require-telegram-auth: ${COMMERCE_MINI_APP_REQUIRE_TELEGRAM_AUTH:true}
    init-data-max-age-seconds: ${COMMERCE_MINI_APP_INIT_DATA_MAX_AGE_SECONDS:86400}

# Supplier import automation foundation (Prompt 01) + email ingestion (Prompt 02).
# No mailbox is configured by default, so the app must start fine with only these defaults;
# the polling job simply finds zero enabled mailboxes and no-ops.
supplier-import:
  storage:
    # local (default) or s3 - see docs/DECISIONS.md ADR-014. Any multi-replica deployment MUST
    # switch to s3; local disk storage is invisible across replicas.
    provider: ${SUPPLIER_IMPORT_STORAGE_PROVIDER:local}
    base-path: ${SUPPLIER_IMPORT_STORAGE_PATH:./data/import-files}
    max-file-size-bytes: ${SUPPLIER_IMPORT_MAX_FILE_SIZE_BYTES:31457280}
    s3:
      bucket: ${SUPPLIER_IMPORT_S3_BUCKET:}
      region: ${SUPPLIER_IMPORT_S3_REGION:eu-central-1}
      # Set for S3-compatible providers (MinIO, etc); leave blank for real AWS S3.
      endpoint: ${SUPPLIER_IMPORT_S3_ENDPOINT:}
      access-key-id: ${SUPPLIER_IMPORT_S3_ACCESS_KEY_ID:}
      secret-access-key: ${SUPPLIER_IMPORT_S3_SECRET_ACCESS_KEY:}
      path-style-access: ${SUPPLIER_IMPORT_S3_PATH_STYLE_ACCESS:false}
      key-prefix: ${SUPPLIER_IMPORT_S3_KEY_PREFIX:}
    # Stage 10 retention (docs/DECISIONS.md ADR-015): opt-in deletion of terminal-batch source
    # files after fileRetentionDays. Disabled by default - an operator must explicitly enable it.
    retention:
      enabled: ${SUPPLIER_IMPORT_RETENTION_ENABLED:false}
      file-retention-days: ${SUPPLIER_IMPORT_RETENTION_FILE_DAYS:180}
      sweep-interval-ms: ${SUPPLIER_IMPORT_RETENTION_SWEEP_INTERVAL_MS:86400000}
      sweep-initial-delay-ms: ${SUPPLIER_IMPORT_RETENTION_SWEEP_INITIAL_DELAY_MS:300000}
      max-deletions-per-sweep: ${SUPPLIER_IMPORT_RETENTION_MAX_DELETIONS_PER_SWEEP:500}
  job:
    default-lease-seconds: ${SUPPLIER_IMPORT_JOB_LEASE_SECONDS:300}
    mailbox-poll-interval-ms: ${SUPPLIER_IMPORT_MAILBOX_POLL_INTERVAL_MS:300000}
    mailbox-poll-initial-delay-ms: ${SUPPLIER_IMPORT_MAILBOX_POLL_INITIAL_DELAY_MS:15000}
    parsing-interval-ms: ${SUPPLIER_IMPORT_PARSING_INTERVAL_MS:30000}
    parsing-initial-delay-ms: ${SUPPLIER_IMPORT_PARSING_INITIAL_DELAY_MS:20000}
    parsing-lease-seconds: ${SUPPLIER_IMPORT_PARSING_LEASE_SECONDS:300}
    normalizing-interval-ms: ${SUPPLIER_IMPORT_NORMALIZING_INTERVAL_MS:30000}
    normalizing-initial-delay-ms: ${SUPPLIER_IMPORT_NORMALIZING_INITIAL_DELAY_MS:25000}
    normalizing-lease-seconds: ${SUPPLIER_IMPORT_NORMALIZING_LEASE_SECONDS:300}
    matching-interval-ms: ${SUPPLIER_IMPORT_MATCHING_INTERVAL_MS:30000}
    matching-initial-delay-ms: ${SUPPLIER_IMPORT_MATCHING_INITIAL_DELAY_MS:35000}
    matching-lease-seconds: ${SUPPLIER_IMPORT_MATCHING_LEASE_SECONDS:300}
    validation-interval-ms: ${SUPPLIER_IMPORT_VALIDATION_INTERVAL_MS:30000}
    validation-initial-delay-ms: ${SUPPLIER_IMPORT_VALIDATION_INITIAL_DELAY_MS:40000}
    validation-lease-seconds: ${SUPPLIER_IMPORT_VALIDATION_LEASE_SECONDS:300}
    apply-interval-ms: ${SUPPLIER_IMPORT_APPLY_INTERVAL_MS:30000}
    apply-initial-delay-ms: ${SUPPLIER_IMPORT_APPLY_INITIAL_DELAY_MS:45000}
    apply-lease-seconds: ${SUPPLIER_IMPORT_APPLY_LEASE_SECONDS:600}
  # AI layout detection (Prompt 03) + AI catalog matcher (Prompt 05) share the same DeepSeek
  # account/dedicated HTTP client (DeepSeekHttpClient/DeepSeekClientConfig, Stage 5) config below. No
  # key configured by default -> Disabled*/no-op providers are wired instead, and a batch/row that
  # actually needs AI is quarantined/NEEDS_REVIEW with a clear reason instead of failing app startup.
  ai:
    deepseek:
      api-key: ${SUPPLIER_IMPORT_DEEPSEEK_API_KEY:}
      model: ${SUPPLIER_IMPORT_DEEPSEEK_MODEL:deepseek-v4-flash}
      base-url: ${SUPPLIER_IMPORT_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      connect-timeout-ms: ${SUPPLIER_IMPORT_DEEPSEEK_CONNECT_TIMEOUT_MS:5000}
      timeout-ms: ${SUPPLIER_IMPORT_DEEPSEEK_TIMEOUT_MS:20000}
      max-retries: ${SUPPLIER_IMPORT_DEEPSEEK_MAX_RETRIES:2}
      retry-backoff-ms: ${SUPPLIER_IMPORT_DEEPSEEK_RETRY_BACKOFF_MS:500}
      max-concurrent-requests: ${SUPPLIER_IMPORT_DEEPSEEK_MAX_CONCURRENT_REQUESTS:4}
      concurrency-acquire-timeout-ms: ${SUPPLIER_IMPORT_DEEPSEEK_CONCURRENCY_ACQUIRE_TIMEOUT_MS:3000}
      circuit-breaker-failure-threshold: ${SUPPLIER_IMPORT_DEEPSEEK_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      circuit-breaker-open-duration-ms: ${SUPPLIER_IMPORT_DEEPSEEK_CIRCUIT_BREAKER_OPEN_DURATION_MS:30000}
  parser:
    max-sheets: ${SUPPLIER_IMPORT_PARSER_MAX_SHEETS:10}
    max-rows-per-sheet: ${SUPPLIER_IMPORT_PARSER_MAX_ROWS:20000}
    max-columns: ${SUPPLIER_IMPORT_PARSER_MAX_COLUMNS:200}
    max-cell-length: ${SUPPLIER_IMPORT_PARSER_MAX_CELL_LENGTH:4000}
    ai-sample-rows: ${SUPPLIER_IMPORT_PARSER_AI_SAMPLE_ROWS:15}
    ai-sample-columns: ${SUPPLIER_IMPORT_PARSER_AI_SAMPLE_COLUMNS:30}
    ai-sample-cell-max-length: ${SUPPLIER_IMPORT_PARSER_AI_SAMPLE_CELL_MAX_LENGTH:160}
    preview-row-count: ${SUPPLIER_IMPORT_PARSER_PREVIEW_ROW_COUNT:30}
    preview-min-valid-row-ratio: ${SUPPLIER_IMPORT_PARSER_PREVIEW_MIN_VALID_ROW_RATIO:0.5}
    final-min-valid-row-ratio: ${SUPPLIER_IMPORT_PARSER_FINAL_MIN_VALID_ROW_RATIO:0.5}
  # Deterministic normalization + candidate search (Prompt 04) and AI matcher automation gates
  # (Prompt 05): fuzzy candidates are bounded to max-candidates and passed to AiCatalogMatcher, which
  # may only select one of them (or NO_MATCH) - never a candidate outside this list.
  matching:
    candidate-fetch-limit: ${SUPPLIER_IMPORT_MATCHING_CANDIDATE_FETCH_LIMIT:300}
    max-candidates: ${SUPPLIER_IMPORT_MATCHING_MAX_CANDIDATES:10}
    min-similarity-threshold: ${SUPPLIER_IMPORT_MATCHING_MIN_SIMILARITY_THRESHOLD:0.15}
    # Opt-in only after confirming V19 (pg_trgm extension + trigram indexes) is actually applied.
    pg-trgm-enabled: ${SUPPLIER_IMPORT_MATCHING_PG_TRGM_ENABLED:false}
    # Global defaults for the Prompt 05 automation gate, overridable per SupplierSource. Model
    # confidence alone can never satisfy this gate - the deterministic score floor always applies too.
    ai-auto-approve-min-score: ${SUPPLIER_IMPORT_MATCHING_AI_AUTO_APPROVE_MIN_SCORE:0.80}
    ai-min-confidence: ${SUPPLIER_IMPORT_MATCHING_AI_MIN_CONFIDENCE:0.55}
    new-product-require-brand: ${SUPPLIER_IMPORT_MATCHING_NEW_PRODUCT_REQUIRE_BRAND:true}
  # Percentage-based public pricing (Prompt 06, D-007). Last-resort fallback only - a shop's
  # ShopSettings.defaultCommissionPercent and a SupplierSource.commissionPercentOverride both take
  # priority when configured.
  pricing:
    default-commission-percent: ${SUPPLIER_IMPORT_PRICING_DEFAULT_COMMISSION_PERCENT:30.0}
  # Batch-level apply guards (Prompt 06, D-012): an anomalous/corrupted file must never be allowed
  # to mass-deactivate or mass-reprice the assortment - see BatchApplyGuardEvaluator.
  reconciliation:
    row-count-collapse-min-ratio: ${SUPPLIER_IMPORT_RECONCILIATION_ROW_COUNT_COLLAPSE_MIN_RATIO:0.5}
    duplicate-identifier-max-ratio: ${SUPPLIER_IMPORT_RECONCILIATION_DUPLICATE_IDENTIFIER_MAX_RATIO:0.2}
    price-delta-warn-ratio: ${SUPPLIER_IMPORT_RECONCILIATION_PRICE_DELTA_WARN_RATIO:0.5}
    price-delta-max-anomalous-row-ratio: ${SUPPLIER_IMPORT_RECONCILIATION_PRICE_DELTA_MAX_ANOMALOUS_ROW_RATIO:0.3}