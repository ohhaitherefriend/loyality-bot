spring:
  application:
    name: loyalty-bot
  
  datasource:
    url: jdbc:h2:file:./data/loyaltydb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: false  # Временно отключаем валидацию для V1
    # Миграция сама создаст колонки если их нет
  
  h2:
    console:
      enabled: true
      path: /h2-console

# Telegram Bot Configuration
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:7995355560:AAEYKC6I17_f3VPB0AX24IqpS2T90Niyqck}
    username: ${TELEGRAM_BOT_USERNAME:plstkwrldbot}
    admin-secret: plstkwrld

# Loyalty Program Settings
loyalty:
  purchase-code:
    expiration-minutes: 10
    length: 6
  spend-code:
    expiration-minutes: 10
    length: 6
  discount-code:
    length: 8
  points:
    bronze-threshold: 0
    silver-threshold: 500
    gold-threshold: 1000

server:
  port: 8080

# Actuator endpoints для health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.plstk: DEBUG
    org.telegram: INFO